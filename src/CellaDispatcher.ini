[SERVER]
ApiEndpointUrl=https://api.staging.cella.cloud/graphql
WarehouseLogin=login
WarehousePassword=password
WarehouseId=warehouse_id

[CONFIG]
ConnectionFailedWaitBeforeRetry=15
LogRetentionDays=7
LogDirectory=logs
TempDirectory=c:\temp
NumberOfCopies=1
Debug=no
EnablePrint=yes
ForceReadDelay=15
PrinterList=*
ExcludePrinterList=
[PRINT_SETTINGS]
; SumatraPDF "-print-settings" applied to PDF documents (Windows only), one line per printer.
; "*" is the default for every printer without a line of its own. Empty keeps the SumatraPDF defaults:
; the page is shrunk to the paper and turned by 90 degrees when it is wider than tall.
; Label printers: use disable-auto-rotation so a label designed wider than tall is not turned sideways.
; Several settings are separated by commas, e.g. disable-auto-rotation,noscale
*=
